[versions]

version-name = "0.1.0"

application-id = "com.tap.mood"
application-namespace = "com.tap.mood"
compile-sdk = "37"
target-sdk = "35"
min-sdk = "28"

java-compiler-version = "25"
java-library-bytecode-version = "11"

android-build-tools-plugin = "9.3.1"
kotlin = "2.4.0"
kotlinter = "5.6.0"

chasm = "1.6.1"
chasm-gradle-plugin = "2.2.0-1.6.1"

androidx-core = "1.19.0"
androidx-lifecycle = "2.11.0"
androidx-webgpu = "1.0.0-alpha05"
compose-core = "1.11.4"
compose-activity = "1.13.0"
compose-multiplatform = "1.11.1"
kotlinx-coroutines = "1.11.0"
metro = "1.4.2"

[plugins]

android-application = { id = "com.android.application", version.ref = "android-build-tools-plugin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-build-tools-plugin" }
chasm = { id = "io.github.charlietap.chasm.gradle", version.ref = "chasm-gradle-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }

conventions-kotlin = { id = "kotlin-conventions" }
conventions-linting = { id = "linting-conventions" }

[libraries]

androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-webgpu = { module = "androidx.webgpu:webgpu", version.ref = "androidx-webgpu" }

androidx-compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-core" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose-core" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-core" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "compose-core" }
androidx-compose-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose-core" }
androidx-compose-activity = { module = "androidx.activity:activity-compose", version.ref = "compose-activity" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
metrox-android = { module = "dev.zacsweers.metro:metrox-android", version.ref = "metro" }
metrox-viewmodel = { module = "dev.zacsweers.metro:metrox-viewmodel", version.ref = "metro" }

[bundles]

androidx = [
    "androidx-core",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-runtime-compose",
]

compose-ui = [
    "androidx-compose-runtime",
    "androidx-compose-ui",
    "androidx-compose-foundation",
    "androidx-compose-material",
    "androidx-compose-activity",
]
